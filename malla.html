  <script>try{var F={fraunces:"'Fraunces',Georgia,serif",jakarta:"'Plus Jakarta Sans',system-ui,sans-serif",fira:"'Fira Sans',system-ui,sans-serif",chivo:"'Chivo',system-ui,sans-serif",space:"'Space Grotesk',system-ui,sans-serif"},f=localStorage.getItem("app_fuente")||localStorage.getItem("estacion_fuente_titulos");if(F[f])document.documentElement.style.setProperty("--serif",F[f])}catch(e){}</script>

  <style>
    :root {
      color-scheme: light;
      --bg: #fbf5ee;
      --bg-gradient: radial-gradient(circle at top, #f3e6dc 0%, #fbf5ee 70%);
      --card-bg: #fffdf9;
      --card-border: #eadfd2;
      --text-main: #3b2a22;
      --text-muted: #7a685d;
      --accent-purple: #7c5cd6;
      --accent-pink: #c2417a;
      --badge-bg: #ece6fb;
      --badge-text: #7c5cd6;
      --item-idle: #fffdf9;
      --item-approved: #f4effc;
      --item-blocked: #f6efe6;
      --serif: 'Fraunces', Georgia, serif;
      --shadow: 0 1px 2px rgba(80,50,30,.06), 0 6px 18px rgba(80,50,30,.06);
    }

    [data-theme=dark] {
      color-scheme: dark;
      --bg: #14121a;
      --bg-gradient: radial-gradient(circle at top, #1d1930 0%, #14121a 70%);
      --card-bg: #1e1b27;
      --card-border: #2d2939;
      --text-main: #efeaf7;
      --text-muted: #a39cb3;
      --accent-purple: #a78bfa;
      --accent-pink: #f472b6;
      --badge-bg: #2b2445;
      --badge-text: #c4b5fd;
      --item-idle: #26222f;
      --item-approved: #2b2445;
      --item-blocked: #1a1722;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
    }
    [data-theme=dark] input, [data-theme=dark] select, [data-theme=dark] textarea {
      background: #26222f;
      color: #efeaf7;
      border-color: #2d2939;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg-gradient);
      margin: 0;
      padding: calc(16px + env(safe-area-inset-top)) 14px calc(104px + env(safe-area-inset-bottom));
      color: var(--text-main);
      min-height: 100dvh;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    .hd {
      max-width: 520px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hd a.back, .hd button {
      height: 38px;
      min-width: 38px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .hd h1 {
      flex: 1;
      min-width: 0;
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0;
      text-align: left;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hd .btn-fuente { font-family: var(--serif); padding: 0 10px; font-size: .95rem; }
    .hd .btn-tema { padding: 0 10px; font-size: 1.05rem; }
    .menu-f {
      position: fixed;
      top: calc(60px + env(safe-area-inset-top));
      right: 16px;
      z-index: 60;
      min-width: 220px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 6px;
      display: none;
    }
    .menu-f.open { display: block; }
    .menu-f .t { font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); padding: 8px 12px 4px; }
    .menu-f button { display: block; width: 100%; text-align: left; padding: 11px 12px; border: 0; background: none; border-radius: 10px; font-size: .95rem; font-weight: 700; color: var(--text-main); cursor: pointer; }
    .menu-f button.on { background: var(--badge-bg); color: var(--badge-text); }

    header { max-width: 520px; margin: 0 auto 18px; text-align: center; }

    .dashboard {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 10px;
    }

    .stat-card { text-align: center; }

    .stat-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 2px;
    }

    .progress-bar-container {
      background: var(--item-blocked);
      height: 8px;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dashboard-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: var(--item-idle);
      border: 1px solid var(--card-border);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-action:hover {
      border-color: var(--accent-purple);
      color: var(--accent-purple);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 14px;
      max-width: 520px;
      margin: 0 auto;
    }
    @media (min-width: 720px) {
      .hd, header, .grid { max-width: 1200px; }
    }

    .semestre {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .semestre-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 4px 2px 10px;
      user-select: none;
    }

    .semestre-title {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
    }

    .semestre-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-status {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--badge-bg);
      color: var(--badge-text);
    }

    .badge-complete { background: #dcfce7; color: #15803d; }
    [data-theme=dark] .badge-complete { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; }

    .chevron {
      transition: transform 0.3s ease;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .chevron.rotated { transform: rotate(-180deg); }

    .materias-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .materia {
      border-radius: 12px;
      padding: 8px 10px;
      background: var(--item-idle);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .materia:not(.bloqueada):active { transform: scale(0.985); }

    .materia.aprobada {
      background: var(--item-approved);
      border-color: color-mix(in srgb, var(--accent-purple) 40%, var(--card-border));
    }

    .materia.bloqueada {
      background: var(--item-blocked);
      border-color: transparent;
      opacity: 0.55;
      pointer-events: none;
    }

    .materia-main {
      flex: 1;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .materia-header-line {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .materia-nombre {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .materia.aprobada .materia-nombre {
      text-decoration: line-through;
      color: var(--accent-purple);
    }

    .btn-edit-electivo {
      font-size: 0.8rem;
      color: var(--accent-purple);
      cursor: pointer;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .materia-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .docente-tag {
      color: var(--accent-purple);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .docente-tag:hover { text-decoration: underline; }

    .nota-wrapper { display: flex; align-items: center; }

    .input-nota {
      width: 48px;
      height: 32px;
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      background: var(--card-bg);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-nota:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.15);
    }

    .input-nota.aprobado { color: #059669; border-color: #a7f3d0; }
    [data-theme=dark] .input-nota.aprobado { color: #6ee7b7; border-color: rgba(110,231,183,.35); }
    .input-nota.reprobado { color: #dc2626; border-color: #fecaca; }

    .semestre-footer {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px dashed var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .promedio-valor {
      font-family: var(--serif);
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 700;
    }

    /* Modal emergente */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      place-items: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.active { display: grid; }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    .modal-card h3 { font-family: var(--serif); margin: 0 0 12px; font-size: 1.1rem; }

    .modal-field { margin-bottom: 12px; }

    .modal-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }

    .modal-input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      background: var(--item-idle);
      color: var(--text-main);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-modal {
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      font-family: inherit;
    }

    .btn-cancel { background: var(--item-blocked); color: var(--text-muted); }
    .btn-save { background: var(--accent-purple); color: #ffffff; }
  </style>
  <script src="app.js?v=4"></script>
</head>
<body>

  <div class="container">

      <button data-f="space" style="font-family:'Space Grotesk',system-ui,sans-serif">Space Grotesk</button>

    <header>
      <div class="dashboard">
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-label">Avance Carrera</div>
            <div class="stat-value" id="stat-porcentaje">0%</div>

          <div class="stat-card">
            <div class="stat-label">Promedio Acumulado</div>

        <div class="progress-bar-container">
          <div class="progress-bar" id="barra-progreso"></div>

        <div class="dashboard-actions">
          <button class="btn-action" id="btn-exportar">💾 Descargar Respaldo</button>

      </div>

    <div class="grid" id="malla"></div>
  </div>

  <div class="modal-overlay" id="modal">

      </div>

        <label class="modal-label">Nombre del Docente</label>
        <input type="text" class="modal-input" id="modal-input-docente" placeholder="Ej: Profesor Pérez">
      </div>

      <div class="modal-actions">
        <button class="btn-modal btn-cancel" id="modal-cancel">Cancelar</button>
        <button class="btn-modal btn-save" id="modal-save">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const btnTema = document.getElementById('btn-tema');
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const prefTema = () => { try { return localStorage.getItem('app_tema') || 'auto'; } catch (e) { return 'auto'; } };
    const esOscuro = () => prefTema() === 'oscuro' || (prefTema() === 'auto' && mq.matches);
    function aplicarTema() {
      document.documentElement.dataset.theme = esOscuro() ? 'dark' : 'light';
      btnTema.textContent = esOscuro() ? '☀️' : '🌙';
      const m = document.querySelector('meta[name=theme-color]');
      if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    }
    btnTema.onclick = () => { try { localStorage.setItem('app_tema', esOscuro() ? 'claro' : 'oscuro'); } catch (e) {} aplicarTema(); };
    if (mq.addEventListener) mq.addEventListener('change', aplicarTema);
    aplicarTema();

    const FUENTES = {fraunces:"'Fraunces',Georgia,serif",jakarta:"'Plus Jakarta Sans',system-ui,sans-serif",fira:"'Fira Sans',system-ui,sans-serif",chivo:"'Chivo',system-ui,sans-serif",space:"'Space Grotesk',system-ui,sans-serif"};
    function aplicarFuente() {
      let f = 'fraunces'; try { f = localStorage.getItem('app_fuente') || localStorage.getItem('estacion_fuente_titulos') || 'fraunces'; } catch (e) {}
      if (!FUENTES[f]) f = 'fraunces';
      document.documentElement.style.setProperty('--serif', FUENTES[f]);
      document.querySelectorAll('#menu-f button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
    }
    document.getElementById('btn-fuente').onclick = e => { e.stopPropagation(); document.getElementById('menu-f').classList.toggle('open'); };
    document.getElementById('menu-f').onclick = e => { e.stopPropagation(); const b = e.target.closest('button'); if (!b) return; try { localStorage.setItem('app_fuente', b.dataset.f); localStorage.setItem('estacion_fuente_titulos', b.dataset.f); } catch (er) {} aplicarFuente(); };
    document.addEventListener('click', () => document.getElementById('menu-f').classList.remove('open'));
    aplicarFuente();

    const malla = {

        { nombre: 'Taller de Programación I', codigo: '202704', creditos: 3, requiere: ['201454'] },
        { nombre: 'Interfaz de Usuario', codigo: '201468', creditos: 2, requiere: ['201454'] },
        { nombre: 'Modelamiento de la Información', codigo: '202706', creditos: 3, requiere: ['202549'] },
        { nombre: 'Inglés I', codigo: '202605', creditos: 4 }
      ],
      'Semestre 3': [
        { nombre: 'Lenguaje de Programación Web I', codigo: '201469', creditos: 2, requiere: ['202704', '201468'] },
        { nombre: 'Lenguaje de Programación O.O I', codigo: '201459', creditos: 2, requiere: ['202704', '201468'] },
        { nombre: 'Construcción de Base de Datos', codigo: '202707', creditos: 2, requiere: ['202704', '201468'] },

      ],
      'Semestre 6': [
        { nombre: 'Cálculo', codigo: 'CAL6', creditos: 4, requiere: ['202548'] },
        { nombre: 'Inteligencia de Negocios I', codigo: 'IN1', creditos: 3, requiere: ['201459', '202713'] },
        { nombre: 'Ingeniería de Software', codigo: 'IS6', creditos: 4, requiere: ['202711'] },
        { nombre: 'Electiva 1', codigo: 'ELECT1', creditos: 3, esElectivo: true },
        { nombre: 'Seguridad Informática', codigo: 'SI6', creditos: 3, requiere: ['202714', '202715'] },
        { nombre: 'Administración de Base de Datos', codigo: 'ABD6', creditos: 3, requiere: ['202714', '202715'] },
        { nombre: 'Inglés IV', codigo: 'ING4', creditos: 2, requiere: ['202607'] }
      ],
      'Semestre 7': [
        { nombre: 'Inteligencia de Negocios II', codigo: 'IN2', creditos: 3, requiere: ['IN1'] },
        { nombre: 'Gestión de Sistemas Computacionales', codigo: 'GSC7', creditos: 3, requiere: ['IS6'] },
        { nombre: 'Formulación de Proyectos Informáticos', codigo: 'FPI7', creditos: 3, requiere: ['IS6'] },
        { nombre: 'Electiva 2', codigo: 'ELECT2', creditos: 3, esElectivo: true },
        { nombre: 'Cloud Computing', codigo: 'CC7', creditos: 3, requiere: ['SI6', 'ABD6'] },
        { nombre: 'Habilidades Comunicativas', codigo: 'HC7', creditos: 2 }
      ],
      'Semestre 8': [
        { nombre: 'Taller de Proyectos Informáticos', codigo: 'TPI8', creditos: 4, requiere: ['GSC7', 'FPI7'] },
        { nombre: 'Lenguaje de Programación Web II', codigo: 'LPW2', creditos: 3, requiere: ['IN2'] },
        { nombre: 'Electiva 3', codigo: 'ELECT3', creditos: 3, esElectivo: true },
        { nombre: 'Auditoría Informática', codigo: 'AI8', creditos: 2 },
        { nombre: 'Proyecto Integrado Final', codigo: 'PIF8', creditos: 5 },
        { nombre: 'Práctica Integrada de Competencias', codigo: 'PIC8', creditos: 4 }
      ]
    };

    function formatearNotaInput(valor) {
      if (!valor && valor !== 0) return '';
      let limpio = valor.toString().trim().replace(/,/g, '.');
      if (/^\d{2}$/.test(limpio)) {
        let entero = limpio[0], decimal = limpio[1];
        return decimal === '0' ? `${entero}` : `${entero},${decimal}`;
      }
      if (/^\d$/.test(limpio)) return limpio;
      let num = parseFloat(limpio);
      if (!isNaN(num)) {
        if (Number.isInteger(num)) return `${num}`;
        return num.toFixed(1).replace('.', ',');
      }
      return valor;
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('data')) {
      try {
        const decoded = JSON.parse(decodeURIComponent(atob(urlParams.get('data'))));
        if (confirm('Se detectaron datos importados desde el enlace. ¿Deseas cargarlos en este dispositivo?')) {
          if (decoded.estado) localStorage.setItem('mallaEstado', JSON.stringify(decoded.estado));
          if (decoded.notas) localStorage.setItem('mallaNotas', JSON.stringify(decoded.notas));
          if (decoded.electivos) localStorage.setItem('mallaElectivos', JSON.stringify(decoded.electivos));
          if (decoded.docentes) localStorage.setItem('mallaDocentes', JSON.stringify(decoded.docentes));
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      } catch (e) {}
    }

    let estado = JSON.parse(localStorage.getItem('mallaEstado') || '{}');
    let notas = JSON.parse(localStorage.getItem('mallaNotas') || '{}');
    let electivosCustom = JSON.parse(localStorage.getItem('mallaElectivos') || '{}');
    let docentes = JSON.parse(localStorage.getItem('mallaDocentes') || '{}');
    let semestresColapsados = JSON.parse(localStorage.getItem('mallaColapso') || '{}');

    const contenedor = document.getElementById('malla');
    const modal = document.getElementById('modal');
    const modalInputNombre = document.getElementById('modal-input-nombre');
    const modalInputDocente = document.getElementById('modal-input-docente');
    const fieldNombreWrap = document.getElementById('field-nombre-wrap');
    let materiaEditando = null;

    function estaDesbloqueada(materia) {
      if (!materia.requiere) return true;
      return materia.requiere.every(cod => estado[cod]);
    }

    function abrirModal(materia, nombreActual) {
      materiaEditando = materia;
      if (materia.esElectivo) {
        fieldNombreWrap.style.display = 'block';
        modalInputNombre.value = electivosCustom[materia.codigo] || nombreActual;
      } else {
        fieldNombreWrap.style.display = 'none';
      }
      modalInputDocente.value = docentes[materia.codigo] || '';
      modal.classList.add('active');
      (materia.esElectivo ? modalInputNombre : modalInputDocente).focus();
    }

    document.getElementById('modal-cancel').onclick = () => {
      modal.classList.remove('active');
      materiaEditando = null;
    };

    document.getElementById('modal-save').onclick = () => {
      if (!materiaEditando) return;
      if (materiaEditando.esElectivo && modalInputNombre.value.trim()) {
        electivosCustom[materiaEditando.codigo] = modalInputNombre.value.trim();
        localStorage.setItem('mallaElectivos', JSON.stringify(electivosCustom));
      }
      if (modalInputDocente.value.trim()) {
        docentes[materiaEditando.codigo] = modalInputDocente.value.trim();
      } else {
        delete docentes[materiaEditando.codigo];
      }
      localStorage.setItem('mallaDocentes', JSON.stringify(docentes));
      modal.classList.remove('active');
      materiaEditando = null;
      renderizar();
    };

    function actualizarDashboardGlobal() {
      const todosLosRamos = Object.values(malla).flat();
      const totalRamos = todosLosRamos.length;
      const aprobados = todosLosRamos.filter(m => estado[m.codigo]).length;

      let sumaNotas = 0, totalConNota = 0;
      todosLosRamos.forEach(m => {
        if (notas[m.codigo]) {
          const valor = parseFloat(notas[m.codigo].toString().replace(',', '.'));
          if (!isNaN(valor)) { sumaNotas += valor; totalConNota++; }
        }
      });

      const promAritmetico = totalConNota > 0 ? (sumaNotas / totalConNota).toFixed(1).replace('.', ',') : '-';
      const porcentaje = Math.round((aprobados / totalRamos) * 100);

      document.getElementById('stat-ramos').textContent = `${aprobados}/${totalRamos}`;
      try { localStorage.setItem('mallaResumen', JSON.stringify({ a: aprobados, t: totalRamos })); } catch (e) {}
      document.getElementById('stat-porcentaje').textContent = `${porcentaje}%`;
      document.getElementById('stat-promedio').textContent = promAritmetico;
      document.getElementById('barra-progreso').style.width = `${porcentaje}%`;
    }

    function renderizar() {
      contenedor.innerHTML = '';

      Object.entries(malla).forEach(([semestre, materias]) => {
        const col = document.createElement('div');
        col.className = 'semestre';

        const totalMaterias = materias.length;
        const aprobadasCount = materias.filter(m => estado[m.codigo]).length;
        const completado = totalMaterias === aprobadasCount;

        const estaColapsado = semestresColapsados[semestre] !== undefined
          ? semestresColapsados[semestre]
          : completado;

        const header = document.createElement('div');
        header.className = 'semestre-header';
        header.innerHTML = `
          <h2 class="semestre-title">${semestre}</h2>
          <div class="semestre-meta">
            <span class="badge-status ${completado ? 'badge-complete' : ''}">
              ${completado ? '✓ Completado' : `${aprobadasCount}/${totalMaterias}`}
            </span>
            <span class="chevron ${estaColapsado ? 'rotated' : ''}">▼</span>
          </div>
        `;

        header.onclick = () => {
          semestresColapsados[semestre] = !estaColapsado;
          localStorage.setItem('mallaColapso', JSON.stringify(semestresColapsados));
          renderizar();
        };

        col.appendChild(header);

        const list = document.createElement('div');
        list.className = 'materias-list';
        if (estaColapsado) list.style.display = 'none';

        let sumaSemestre = 0, cantNotasSemestre = 0;

        materias.forEach(m => {
          const div = document.createElement('div');
          div.className = 'materia';

          const aprobada = !!estado[m.codigo];
          const desbloqueada = estaDesbloqueada(m);

          if (aprobada) div.classList.add('aprobada');
          if (!desbloqueada) div.classList.add('bloqueada');

          const mainBox = document.createElement('div');
          mainBox.className = 'materia-main';

          const nombreTexto = (m.esElectivo && electivosCustom[m.codigo]) 
            ? electivosCustom[m.codigo] 
            : m.nombre;

          const line = document.createElement('div');
          line.className = 'materia-header-line';

          const titleSpan = document.createElement('span');
          titleSpan.className = 'materia-nombre';
          titleSpan.textContent = nombreTexto;
          line.appendChild(titleSpan);

          if (m.esElectivo) {
            const editBtn = document.createElement('span');
            editBtn.className = 'btn-edit-electivo';
            editBtn.textContent = '✎';
            editBtn.title = 'Personalizar electivo';
            editBtn.onclick = (e) => {
              e.stopPropagation();
              abrirModal(m, nombreTexto);
            };
            line.appendChild(editBtn);
          }

          const subSpan = document.createElement('span');
          subSpan.className = 'materia-sub';

          const credSpan = document.createElement('span');
          credSpan.textContent = `${m.codigo} • ${m.creditos} cr`;
          subSpan.appendChild(credSpan);

          const docenteTexto = docentes[m.codigo] || '+ Docente';
          const docSpan = document.createElement('span');
          docSpan.className = 'docente-tag';
          docSpan.textContent = `👤 ${docenteTexto}`;
          docSpan.title = 'Editar docente';
          docSpan.onclick = (e) => {
            e.stopPropagation();
            abrirModal(m, nombreTexto);
          };
          subSpan.appendChild(docSpan);

          mainBox.appendChild(line);
          mainBox.appendChild(subSpan);

          mainBox.onclick = () => {
            if (!desbloqueada) return;
            estado[m.codigo] = !estado[m.codigo];
            localStorage.setItem('mallaEstado', JSON.stringify(estado));
            renderizar();
          };

          div.appendChild(mainBox);

          if (desbloqueada) {
            const notaWrapper = document.createElement('div');
            notaWrapper.className = 'nota-wrapper';

            const input = document.createElement('input');
            input.type = 'text';
            input.inputMode = 'decimal';
            input.className = 'input-nota';
            input.placeholder = '-';

            const notaGuardada = notas[m.codigo] || '';
            input.value = notaGuardada ? formatearNotaInput(notaGuardada) : '';

            if (notaGuardada) {
              const val = parseFloat(notaGuardada.toString().replace(',', '.'));
              if (!isNaN(val)) {
                sumaSemestre += val;
                cantNotasSemestre++;
                input.classList.add(val >= 4.0 ? 'aprobado' : 'reprobado');
              }
            }

            input.onchange = (e) => {
              const normalizado = formatearNotaInput(e.target.value);
              if (normalizado) {
                const numVal = parseFloat(normalizado.replace(',', '.'));
                if (!isNaN(numVal) && numVal >= 1.0 && numVal <= 7.0) {
                  notas[m.codigo] = normalizado;
                  if (numVal >= 4.0) {
                    estado[m.codigo] = true;
                    localStorage.setItem('mallaEstado', JSON.stringify(estado));
                  }
                } else {
                  delete notas[m.codigo];
                }
              } else {
                delete notas[m.codigo];
              }
              localStorage.setItem('mallaNotas', JSON.stringify(notas));
              renderizar();
            };

            notaWrapper.appendChild(input);
            div.appendChild(notaWrapper);
          }

          list.appendChild(div);
        });

        col.appendChild(list);

        const footer = document.createElement('div');
        footer.className = 'semestre-footer';
        const promSem = cantNotasSemestre > 0 
          ? (sumaSemestre / cantNotasSemestre).toFixed(1).replace('.', ',') 
          : '-';
        footer.innerHTML = `
          <span>Promedio Semestral</span>
          <span class="promedio-valor">${promSem}</span>
        `;
        col.appendChild(footer);

        contenedor.appendChild(col);
      });

      actualizarDashboardGlobal();
    }

    document.getElementById('btn-exportar').onclick = () => {
      const backup = { estado, notas, electivosCustom, docentes };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'malla-curricular-respaldo.json';
      a.click();
    };

    document.getElementById('btn-importar').onclick = () => {
      document.getElementById('file-input').click();
    };

    document.getElementById('file-input').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.estado) localStorage.setItem('mallaEstado', JSON.stringify(data.estado));
          if (data.notas) localStorage.setItem('mallaNotas', JSON.stringify(data.notas));
          if (data.electivosCustom) localStorage.setItem('mallaElectivos', JSON.stringify(data.electivosCustom));
          if (data.docentes) localStorage.setItem('mallaDocentes', JSON.stringify(data.docentes));
          location.reload();
        } catch (err) {
          alert('Archivo de respaldo no válido.');
        }
      };
      reader.readAsText(file);
    };

    document.getElementById('btn-compartir').onclick = () => {
      const backup = { estado, notas, electivos: electivosCustom, docentes };
      const raw = btoa(encodeURIComponent(JSON.stringify(backup)));
      const shareUrl = `${window.location.origin}${window.location.pathname}?data=${raw}`;
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert('¡Enlace copiado al portapapeles! Ábrelo en tu teléfono para cargar tus notas al instante.');
      });
    };

    renderizar();
  </script>
</body>
</html>
