  <style>
    :root{color-scheme:light;--bg1:#eef2ff;--bg2:#f8fafc;--card:#fffdf9;--border:#eadfd2;--text:#3b2a22;--title:#3b2a22;--muted:#7a685d;--arrow:#cdbfae;--badge-bg:#e0e7ff;--badge-ink:#65534a;--hover-line:#c7d2fe;--hover-glow:rgba(79,70,229,.1);--i-cajas:#eef2ff;--i-cajas-l:#c7d2fe;--i-compras:#fdf2fa;--i-compras-l:#fce7f3;--i-ahorros:#ecfdf5;--i-ahorros-l:#a7f3d0;--g1:#4f46e5;--g2:#ec4899;--bg:#fbf5ee;--soft:#f6efe6;--hover:#eadfd2;--badge:#f1e8dd;--f0:#c4623f;--f1:#5f8f7a;--f2:#8a6fb0;--f3:#b98524;--f4:#4f7fb5;--f5:#b9567a;--f6:#6f8f3d;--f7:#a0675a;--serif:'Fraunces','Lora',Georgia,serif;--shadow:0 1px 2px rgba(80,50,30,.06),0 6px 18px rgba(80,50,30,.06)}

    /* ===== Centrado real en el teléfono ===== */
    html, body { height: 100dvh; }
    body {
      min-height: 0;
      padding: 20px; /* aquí ajusto el centro del texto */

    html, body { position: static; height: auto; min-height: 100dvh; overflow: auto; overscroll-behavior: auto; }
    body { align-items: flex-start; padding: calc(70px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom)); }

    .r-t { font-family: var(--serif); font-weight: 700; font-size: 1.05rem; }

    .r-s a { color: var(--g1); font-weight: 700; }

    /* ===== Menú "después": encabezado compacto, aviso, tarjetas con resumen ===== */
    body { display: block !important; padding: calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)) !important; }

    .hd h1 { flex: 1; min-width: 0; font-size: 1.35rem; margin: 0; text-align: left; background: none; -webkit-text-fill-color: var(--title); color: var(--title); }
    .hd .btn-fuente, .hd .btn-tema { position: static; padding: 0 10px; }

    .busca { margin-bottom: 12px !important; }
    .alerta { background: #fdeae4; border: 1px solid #f3c5b6; color: #a8431f; border-radius: 14px; padding: 12px 14px; font-size: .86rem; font-weight: 700; line-height: 1.4; margin-bottom: 16px; }
    [data-theme=dark] .alerta { background: #3a2026; border-color: #5b2f38; color: #f5a58a; }
    .alerta.ok { background: var(--i-ahorros); border-color: var(--i-ahorros-l); color: #2f7d5f; }
    .sec-t { font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 4px 2px 8px; }
    .esp { display: flex; flex-direction: column; gap: 10px; }
    .esp a { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; padding: 13px 14px 13px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); text-decoration: none; color: inherit; }
    .esp a:active { transform: scale(.98); }
    .esp a::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
    .esp .ib { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 1.25rem; flex: none; }
    .esp .tx { flex: 1; min-width: 0; }
    .esp .tt { font-family: var(--serif); font-weight: 700; font-size: 1rem; }

    .esp .monto { font-family: var(--serif); font-weight: 700; font-size: 1.05rem; color: #2f7d5f; white-space: nowrap; }
    [data-theme=dark] .esp .monto { color: #5ed3a4; }
    .barra { height: 6px; border-radius: 99px; background: var(--badge-bg); margin-top: 8px; overflow: hidden; }
    .barra i { display: block; height: 100%; background: var(--f5); border-radius: 99px; }

    .pie a, .pie button { color: var(--f0); font-weight: 800; background: none; border: 0; font: inherit; font-weight: 800; cursor: pointer; text-decoration: none; }

<body>
<div class="wrap">
  <div class="hd">
    <a class="back" href="/" aria-label="Volver a Mi Espacio">←</a>
    <h1>Mi Organizador</h1>
    <button class="btn-fuente" id="btn-fuente" aria-label="Cambiar la letra de los títulos">Aa</button>
    <button class="btn-tema" id="btn-tema" aria-label="Cambiar entre modo claro y oscuro"></button>
  </div>
  <div class="menu-f" id="menu-f"><div class="t">Letra de los títulos</div><button data-f="fraunces" style="font-family:'Fraunces',Georgia,serif">Fraunces (la de ahora)</button><button data-f="jakarta" style="font-family:'Plus Jakarta Sans',system-ui,sans-serif">Plus Jakarta (sin serif)</button><button data-f="fira" style="font-family:'Fira Sans',system-ui,sans-serif">Fira Sans</button><button data-f="chivo" style="font-family:'Chivo',system-ui,sans-serif">Chivo</button><button data-f="space" style="font-family:'Space Grotesk',system-ui,sans-serif">Space Grotesk</button></div>

  <input class="busca" id="q" type="search" placeholder="Buscar en todo: objeto, producto, caja…" autocomplete="off" aria-label="Buscar en todo el organizador">
  <div class="res" id="res" hidden></div>

  <div class="alerta" id="alerta" hidden></div>

  <div class="sec-t">Tus espacios</div>
  <div class="esp">
    <a href="cajas.html" style="--c:var(--f2)">
      <div class="ib icon-cajas">📦</div>
      <div class="tx"><div class="tt">Cajas y Espacios</div><div class="ss" id="d-cajas">Cajas, cajones y objetos con fotos</div></div>
      <div class="ch">›</div>
    </a>
    <a href="compras.html" style="--c:var(--f5)">
      <div class="ib icon-compras">🛍️</div>
      <div class="tx"><div class="tt">Reposición y Compras</div><div class="ss" id="d-compras">Higiene, skincare, stock y lugares</div>
        <div class="barra" id="barra" hidden><i></i></div><div class="ss" id="d-stock" hidden></div></div>
      <div class="ch">›</div>
    </a>
    <a href="ahorros.html" style="--c:var(--f1)">
      <div class="ib icon-ahorros">💰</div>
      <div class="tx"><div class="tt">Ahorros</div><div class="ss">Total ahorrado</div></div>
      <div class="monto" id="d-ahorros">$ 0</div>
    </a>
  </div>

  <p class="pie" id="pie"></p>
</div>

  <script>
    const btn = document.getElementById('btn-tema');
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const pref = () => { try { return localStorage.getItem('app_tema') || 'auto'; } catch (e) { return 'auto'; } };
    const oscuro = () => pref() === 'oscuro' || (pref() === 'auto' && mq.matches);
    function aplicar() {
      document.documentElement.dataset.theme = oscuro() ? 'dark' : 'light';
      btn.textContent = oscuro() ? '☀️' : '🌙';
      const m = document.querySelector('meta[name=theme-color]');
      if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg2').trim();
    }
    btn.onclick = () => { try { localStorage.setItem('app_tema', oscuro() ? 'claro' : 'oscuro'); } catch (e) {} aplicar(); };
    if (mq.addEventListener) mq.addEventListener('change', aplicar);
    aplicar();
      const FUENTES = {fraunces:"'Fraunces',Georgia,serif",jakarta:"'Plus Jakarta Sans',system-ui,sans-serif",fira:"'Fira Sans',system-ui,sans-serif",chivo:"'Chivo',system-ui,sans-serif",space:"'Space Grotesk',system-ui,sans-serif"};
    function aplicarFuente() {
      let f = 'fraunces'; try { f = localStorage.getItem('app_fuente') || 'fraunces'; } catch (e) {}
      if (!FUENTES[f]) f = 'fraunces';
      document.documentElement.style.setProperty('--serif', FUENTES[f]);
      document.querySelectorAll('#menu-f button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
    }
    document.getElementById('btn-fuente').onclick = e => { e.stopPropagation(); document.getElementById('menu-f').classList.toggle('open'); };
    document.getElementById('menu-f').onclick = e => { e.stopPropagation(); const b = e.target.closest('button'); if (!b) return; try { localStorage.setItem('app_fuente', b.dataset.f); } catch (er) {} aplicarFuente(); };
    document.addEventListener('click', () => document.getElementById('menu-f').classList.remove('open'));
    aplicarFuente();
  </script>
  <script>
  (function () {
    const leer = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
    const norm = x => String(x ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = n => '$ ' + Math.round(n || 0).toLocaleString('es-CL');
    const cajas = leer('org_cajas', null), compras = leer('org_compras', null), ahorros = leer('org_ahorros', null);
    const $ = id => document.getElementById(id);

    if (Array.isArray(cajas) && cajas.length) {
      const objs = cajas.reduce((n, c) => n + ((c.items || []).length), 0);
      $('d-cajas').textContent = cajas.length + (cajas.length === 1 ? ' caja' : ' cajas') + ' · ' + objs + (objs === 1 ? ' objeto' : ' objetos');
    }
    let total = 0, falta = 0, urg = 0, porCat = [];
    if (Array.isArray(compras)) {
      compras.forEach(c => {
        let f = 0;
        (c.items || []).forEach(p => { total++; if (p.tieneRepuesto === 'no') { falta++; f++; if (p.urgente) urg++; } });
        if (f) porCat.push(c.nombre + ' (' + f + ')');
      });
    }
    if (total) {
      $('d-compras').textContent = falta + ' por comprar · ' + urg + (urg === 1 ? ' urgente' : ' urgentes');
      const pct = Math.round((total - falta) / total * 100);
      $('barra').hidden = false; $('barra').firstElementChild.style.width = pct + '%';
      $('d-stock').hidden = false; $('d-stock').textContent = pct + '% del stock al día';
      const a = $('alerta'); a.hidden = false;
      if (falta) a.textContent = falta + (falta === 1 ? ' producto por reponer' : ' productos por reponer') + ' · ' + porCat.join(', ');
      else { a.textContent = 'Todo el stock está al día ✓'; a.classList.add('ok'); }
    }
    if (Array.isArray(ahorros) && ahorros.length) {
      const t = ahorros.reduce((n, c) => n + (c.saldo !== undefined ? (+c.saldo || 0) : (+c.b || 0) + (+c.m || 0)), 0);
      $('d-ahorros').textContent = money(t);
    }

    // Último respaldo + hacer respaldo (descarga todo el sitio, igual que la portada)
    function pie() {
      const t = leer('portada_ultimo_respaldo', null);
      $('pie').innerHTML = 'Último respaldo: ' + (t ? esc(new Date(t).toLocaleDateString('es-CL', { day: '2-digit', month: 'short' })) : 'nunca') + ' · <button id="hr">Hacer respaldo</button>';
      $('hr').onclick = () => {
        try { localStorage.setItem('portada_ultimo_respaldo', JSON.stringify(new Date().toISOString())); } catch (e) {}
        MiEspacio.descargar(MiEspacio.exportar(), 'mi-espacio-respaldo-' + MiEspacio.fechaArchivo() + '.json'); pie();
      };
    }
    pie();

    // Búsqueda global
    const q = $('q'), res = $('res');
    q.addEventListener('input', () => {
      const t = norm(q.value);
      if (!t) { res.hidden = true; res.innerHTML = ''; return; }
      const out = [];
      (Array.isArray(cajas) ? cajas : []).forEach(c => (c.items || []).forEach(it => {
        if (norm(it.nombre).includes(t) || norm(it.detalles).includes(t)) out.push({ href: 'cajas.html', t: it.nombre, s: '📦 ' + c.nombre + (c.ubicacion ? ' · ' + c.ubicacion : '') });
      }));
      (Array.isArray(compras) ? compras : []).forEach(c => (c.items || []).forEach(p => {
        if (norm(p.nombre).includes(t) || norm(p.donde).includes(t)) out.push({ href: 'compras.html', t: p.nombre, s: '🛍️ ' + c.nombre + (p.donde ? ' · ' + p.donde : '') });
      }));
      (Array.isArray(cajas) ? cajas : []).forEach(c => { if (norm(c.nombre).includes(t)) out.push({ href: 'cajas.html', t: c.nombre, s: '📦 Caja' + (c.ubicacion ? ' · ' + c.ubicacion : '') }); });
      res.hidden = false;
      res.innerHTML = out.length ? out.slice(0, 15).map(r => '<a href="' + r.href + '"><b>' + esc(r.t) + '</b><small>' + esc(r.s) + '</small></a>').join('') : '<div class="vacio">Sin resultados para “' + esc(q.value) + '”.</div>';
    });
  })();
  </script>
</div>
