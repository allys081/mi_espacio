<style>
:root{--serif:'Fraunces',Georgia,serif;--g1:#7c5cd6;--g2:#c2417a}
[data-theme=light]{--bg:#fbf5ee;--bg1:#f3e6dc;--card:#fffdf9;--border:#eadfd2;--text:#3b2a22;--muted:#7a685d;--soft:#f6efe6;--ok:#2f7d5f;--warn:#c4623f;--act:#6d4bd1;--sh:0 1px 2px rgba(80,50,30,.06),0 6px 18px rgba(80,50,30,.06)}
[data-theme=dark]{color-scheme:dark;--bg:#14121a;--bg1:#1d1930;--card:#1e1b27;--border:#2d2939;--text:#efeaf7;--muted:#a39cb3;--soft:#26222f;--ok:#5ed3a4;--warn:#f0916d;--act:#c4b5fd;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:radial-gradient(circle at top,var(--bg1),var(--bg) 70%) fixed;color:var(--text);min-height:100dvh;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(112px + env(safe-area-inset-bottom,0px));gap:12px;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px}.top small{flex:1;font-size:.72rem;font-weight:800;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;padding-left:4px}
.ib{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--text);display:grid;place-items:center;font:800 .92rem var(--serif);cursor:pointer;font-family:var(--serif)}
.ib i{width:1.3em;height:1.3em}
.sal{text-align:center;padding:4px 8px 2px}
h1{font-family:var(--serif);font-size:clamp(1.25rem,5.6vw,1.8rem);line-height:1.12;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sal p{color:var(--muted);font-size:.82rem;margin-top:4px}
.hero{display:block;border-radius:22px;padding:16px 18px 8px;background:linear-gradient(135deg,#7c5cd6,#c2417a);color:#fff;box-shadow:var(--sh);text-decoration:none}
.hero .p{text-align:center;padding-bottom:12px}.hero small{font-size:.66rem;letter-spacing:1px;font-weight:800;opacity:.85;display:block}
.hero b.t{display:block;font-family:var(--serif);font-size:clamp(1.3rem,6vw,1.6rem);margin:5px 0 3px;font-weight:600}.hero .s{font-size:.82rem;opacity:.92}
.hero .sec{font-size:.62rem;letter-spacing:1px;font-weight:800;opacity:.85;padding:8px 0 3px;border-top:1px solid rgba(255,255,255,.22);text-align:left}
.hero .fila{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.18);text-align:left}
.hero .fila>div{flex:1;min-width:0}.hero .fila b{display:block;font-size:.9rem}.hero .fila span{font-size:.74rem;opacity:.85}
.pill{background:rgba(255,255,255,.22);border-radius:99px;padding:3px 10px;font-size:.68rem;font-weight:800;white-space:nowrap}

.emp .pill.w{background:#fff;color:#a02a62}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);color:inherit;text-decoration:none}
.card .bar{width:4px;align-self:stretch;border-radius:4px}
.card .t{flex:1;min-width:0}.card small{display:block;font-size:.64rem;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.card b{display:block;font-size:.92rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .sub{font-size:.74rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{text-decoration:none;border:0;border-radius:12px;min-height:44px;padding:0 16px;font:800 .82rem 'Plus Jakarta Sans',system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.s{background:var(--soft);color:var(--text);border:1px solid var(--border)}
.resp{border:0;background:none;color:var(--muted);font:700 .78rem 'Plus Jakarta Sans',system-ui,sans-serif;min-height:44px;text-align:center;cursor:pointer}.resp.w{color:var(--warn)}
.sp{flex:1}
.dock{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:8px;box-shadow:var(--sh);z-index:50}
.dock a{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 8px;border-radius:16px;font-size:.68rem;font-weight:700;color:var(--muted);text-decoration:none;text-align:center;line-height:1.1;min-height:56px}
.dock a i{width:1.7em;height:1.7em;color:var(--text)}
.dock em{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;height:18px;border-radius:9px;background:var(--g1);color:#fff;font:800 .64rem/18px system-ui;font-style:normal;text-align:center;padding:0 4px}
.ov{position:fixed;inset:0;z-index:1000;background:rgba(8,6,14,.62);display:none;align-items:center;justify-content:center;padding:18px}.ov.on{display:flex}
.md{width:100%;max-width:420px;max-height:90dvh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.md h3{font-family:var(--serif);font-size:1.15rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.md h3 button{width:44px;height:44px;border:0;background:none;color:var(--muted);cursor:pointer}
.md label:not(.chk){display:block;font-size:.64rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
.md input[type=text],.md textarea{width:100%;border-radius:12px;border:1.5px solid var(--border);background:var(--soft);color:var(--text);padding:12px;font:inherit;font-size:.92rem}
.md input:focus,.md textarea:focus{outline:0;border-color:var(--g1)}.md textarea{min-height:84px;resize:vertical}
.cols{display:flex;gap:12px;margin:6px 0 12px}.cols button{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer}.cols button.on{outline:3px solid var(--text);outline-offset:2px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700;cursor:pointer}.chk input{width:26px;height:26px;accent-color:var(--g1)}
.acc{display:flex;gap:10px;margin-top:10px}.acc>*{flex:1}
.bar2{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin:8px 0}.bar2 i{display:block;height:100%;background:var(--ok)}
.fopt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 12px;border-radius:12px;border:1.5px solid transparent;background:none;color:var(--text);font-size:1rem;cursor:pointer;text-align:left}.fopt.on{border-color:var(--g1)}
#toast{position:fixed;left:14px;right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--text);color:var(--bg);border-radius:14px;padding:12px 14px;font-weight:700;font-size:.82rem;display:none;justify-content:space-between;z-index:1100}#toast.show{display:flex}#toast a{color:var(--g1);font-weight:800}
.mu{color:var(--muted)}
</style>

<div class="card" id="c-nota"><div class="bar" style="background:#3b82f6"></div><div class="t"><small id="n-lbl">Notas importantes</small><b id="n-txt">Aún no tienes notas</b></div><button class="btn" id="b-nota">Nueva nota</button></div>
<div class="card" id="c-comp"><div class="bar" style="background:#db2777"></div><div class="t"><small>Me falta comprar</small><b id="p-txt">Nada por comprar</b><div class="sub" id="p-sub"></div></div><a class="btn s" href="compras.html" id="b-comp">Ver lista</a></div>

<div class="ov" id="o-fuente"><div class="md" role="dialog" aria-label="Letra de los títulos"><h3>Letra de los títulos<button data-x aria-label="Cerrar"><i class="ic-cerrar"></i></button></h3><div id="f-lista"></div></div></div>
<div id="toast"><span id="toast-t"></span><a href="instituto.html#notas" id="toast-a" hidden>Ver</a></div>

<script src="app.js"></script>
<script>
const $ = s => document.querySelector(s);
const leer = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt; function toast(t, ver) { $('#toast-t').textContent = t; $('#toast-a').hidden = !ver; $('#toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('#toast').classList.remove('show'), 3200); }
function abrir(id) { document.getElementById(id).classList.add('on'); } function cerrar(id) { document.getElementById(id).classList.remove('on'); }
document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-x]')) o.classList.remove('on'); }));

/* Saludo según la hora */
(function () { const h = new Date().getHours(); $('#saludo').textContent = (h < 12 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches') + ', ¿qué revisamos?'; })();

/* Letra y tema */
$('#btn-tema').onclick = () => MiEspacio.abrirTema();
const FUENTES = {fraunces:["Fraunces","'Fraunces',Georgia,serif"],jakarta:["Plus Jakarta Sans","'Plus Jakarta Sans',system-ui,sans-serif"],fira:["Fira Sans","'Fira Sans',system-ui,sans-serif"],chivo:["Chivo","'Chivo',system-ui,sans-serif"],space:["Space Grotesk","'Space Grotesk',system-ui,sans-serif"]};
function pintarFuentes() {
  let f = 'fraunces'; try { f = localStorage.getItem('app_fuente') || 'fraunces'; } catch (e) {}
  if (!FUENTES[f]) f = 'fraunces';
  document.documentElement.style.setProperty('--serif', FUENTES[f][1]);
  $('#f-lista').innerHTML = Object.keys(FUENTES).map(k => `<button class="fopt ${k === f ? 'on' : ''}" data-f="${k}" style="font-family:${FUENTES[k][1]}">${FUENTES[k][0]}${k === f ? '<i class=ic-check></i>' : ''}</button>`).join('');
}
$('#btn-fuente').onclick = () => { pintarFuentes(); abrir('o-fuente'); };
$('#f-lista').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; try { localStorage.setItem('app_fuente', b.dataset.f); } catch (er) {} pintarFuentes(); };
pintarFuentes();

/* Datos */
const hoy = new Date(), pad = n => String(n).padStart(2, '0');
const HOY = hoy.getFullYear() + '-' + pad(hoy.getMonth() + 1) + '-' + pad(hoy.getDate());
const u = s => { const a = String(s).split('-').map(Number); return Date.UTC(a[0], a[1] - 1, a[2]); };
const dias = s => Math.round((u(s) - u(HOY)) / 864e5);
const cuando = n => n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : 'En ' + n + ' días';
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'], MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fechaCorta = s => { const d = new Date(u(s)); return DIAS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MES[d.getUTCMonth()]; };
const TIPO = { certamen: 'Certamen', trabajo: 'Trabajo', presentacion: 'Presentación', tarea: 'Tarea' };

function pintarHero() {
  const cal = leer('estacion_cal_items_v2', []);
  const pend = (Array.isArray(cal) ? cal : []).filter(x => x && !x.checked && x.evalDate && dias(x.evalDate) >= 0).sort((a, b) => dias(a.evalDate) - dias(b.evalDate));
  const est = leer('mallaEstado', null), nram = est && typeof est === 'object' ? Object.values(est).filter(Boolean).length : 0;
  const el = $('#hero');
  if (!pend.length) {
    el.innerHTML = `<a class="hero" href="instituto.html"><div class="p"><small>AL DÍA</small><b class="t">Sin evaluaciones próximas</b><span class="s">Aún no hay datos. Empieza por cualquier sección de abajo.</span></div></a>`;
    return pend;
  }
  const p = pend[0], resto = pend.slice(1, 4);
  // Qué conviene empezar ya: trabajos y presentaciones con plazo de preparación (se puede fijar por evento con "empezarAntes" en días)
  const lead = x => x.empezarAntes != null ? +x.empezarAntes : (x.pesado || x.kind === 'trabajo') ? 7 : x.kind === 'presentacion' ? 4 : 0;
  const ya = pend.filter(x => lead(x) > 0 && dias(x.evalDate) <= lead(x) && x !== p).slice(0, 2);
  let h = `<a class="hero" href="instituto.html"><div class="p"><small>PRÓXIMO</small><b class="t">${esc(p.title)}</b><span class="s">${cuando(dias(p.evalDate))}${nram ? ' · ' + nram + (nram === 1 ? ' ramo aprobado' : ' ramos aprobados') : ''}</span></div>`;
  if (resto.length) h += `<div class="sec">DESPUÉS</div>` + resto.map(x => `<div class="fila"><div><b>${esc(x.title)}</b><span>${fechaCorta(x.evalDate)} · ${TIPO[x.kind] || ''}</span></div><span class="pill">${cuando(dias(x.evalDate))}</span></div>`).join('');
  if (ya.length) h += `<div class="sec">CONVIENE EMPEZAR YA</div>` + ya.map(x => { const d = dias(x.evalDate), pes = x.pesado || x.kind === 'trabajo'; return `<div class="emp"><div class="r"><b>${esc(x.title)}</b><span class="pill ${pes ? 'w' : ''}">${pes ? 'Trabajo pesado' : 'Preparar'}</span></div><p>Empieza hoy: ${d === 0 ? 'es hoy' : d === 1 ? 'queda 1 día' : 'quedan ' + d + ' días'}.</p></div>`; }).join('');
  el.innerHTML = h + '</a>';
  return pend;
}
function pintarNotas() {
  const n = leer('estacion_notas_importantes', []); const l = Array.isArray(n) ? n : [];
  const ord = l.slice().sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || (b.ts || 0) - (a.ts || 0));
  $('#n-lbl').textContent = l.length ? l.length + (l.length === 1 ? ' nota importante' : ' notas importantes') : 'Notas importantes';
  $('#n-txt').textContent = ord[0] ? ord[0].title : 'Aún no tienes notas';
  if (ord[0] && ord[0].color) $('#c-nota .bar').style.background = ord[0].color;
}
function pintarCompras() {
  const compras = leer('org_compras', null); let falta = 0, urg = 0; const por = [];
  if (Array.isArray(compras)) compras.forEach(c => { let n = 0; (c.items || []).forEach(p => { if (p.tieneRepuesto === 'no') { falta++; n++; if (p.urgente) urg++; } }); if (n) por.push(c.nombre + ' (' + n + ')'); });
  $('#p-txt').textContent = falta ? falta + ' por reponer' + (urg ? ' · ' + urg + (urg === 1 ? ' urgente' : ' urgentes') : '') : 'Nada por comprar';
  $('#p-sub').textContent = por.join(' · ');
  $('#b-comp').textContent = falta ? 'Ver lista' : 'Abrir';
  badge('#d-org', falta);
}
function badge(id, n) { const e = $(id); e.hidden = !n; e.textContent = n; }
function pintarDock(pend) {
  const dat = leer('estacion_detallada_data', null), cats = leer('estacion_categorias', null);
  if (dat && cats && Array.isArray(dat.renaico) && Array.isArray(cats.renaico)) {
    const lista = dat.renaico.filter(it => { const c = cats.renaico.find(x => x.key === it.cat); return c && c.packing; });
    badge('#d-tra', lista.filter(i => !i.checked).length);
  }
  badge('#d-ins', pend ? pend.length : 0);
}

/* Nueva nota (ventana en medio) */
const COLS = ['#e11d48', '#d9a406', '#16a34a', '#3b82f6', '#8b5cf6']; let colSel = COLS[0];
$('#cols').innerHTML = COLS.map((c, i) => `<button type="button" data-c="${c}" style="background:${c}" class="${i === 0 ? 'on' : ''}" aria-label="Color ${i + 1}"></button>`).join('');
$('#cols').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; colSel = b.dataset.c; document.querySelectorAll('#cols button').forEach(x => x.classList.toggle('on', x === b)); };
$('#b-nota').onclick = () => { $('#nt').value = ''; $('#nx').value = ''; $('#np').checked = false; abrir('o-nota'); setTimeout(() => $('#nt').focus(), 60); };
$('#ng').onclick = () => {
  const t = $('#nt').value.trim(); if (!t) { toast('Escribe un título para la nota'); $('#nt').focus(); return; }
  const l = leer('estacion_notas_importantes', []); const lista = Array.isArray(l) ? l : [];
  lista.unshift({ id: 'n' + Date.now().toString(36), ts: Date.now(), title: t, text: $('#nx').value.trim(), color: colSel, pin: $('#np').checked });
  try { localStorage.setItem('estacion_notas_importantes', JSON.stringify(lista)); }
  catch (e) { toast('No hay espacio para guardar: haz un respaldo y revisa las fotos'); return; }
  cerrar('o-nota'); pintarNotas(); toast('Nota guardada en Instituto', true);
};
$('#c-nota').addEventListener('click', e => { if (!e.target.closest('button')) location.href = 'instituto.html#notas'; });

/* Respaldo */
function pintarResp() {
  const t = leer('portada_ultimo_respaldo', null), hay = MiEspacio.claves().length > 0;
  const d = t ? Math.floor((Date.now() - new Date(t).getTime()) / 864e5) : null;
  const r = $('#resp'); r.classList.toggle('w', hay && (d === null || d >= 30));
  r.textContent = 'Respaldo total · ' + (d === null ? 'último: nunca' : d === 0 ? 'hoy' : d === 1 ? 'ayer' : 'hace ' + d + ' días');
  $('#r-est').textContent = t ? 'Último respaldo: ' + new Date(t).toLocaleString('es-CL', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Último respaldo: nunca';
  const m = MiEspacio.uso();
  $('#r-m').style.width = Math.max(2, m.pct) + '%';
  $('#r-t').textContent = 'Espacio usado en este navegador: ' + (m.bytes / 1048576).toFixed(1) + ' MB de unos 5 MB' + (m.pct >= 80 ? ' · cerca del límite: haz un respaldo y revisa las fotos.' : '.');
}
$('#resp').onclick = () => { pintarResp(); abrir('o-resp'); };
$('#r-bk').onclick = () => {
  try { localStorage.setItem('portada_ultimo_respaldo', JSON.stringify(new Date().toISOString())); } catch (e) {}
  MiEspacio.descargar(MiEspacio.exportar(), 'mi-espacio-respaldo-' + MiEspacio.fechaArchivo() + '.json');
  pintarResp(); toast('Respaldo descargado');
};
$('#r-rs').onclick = () => $('#r-file').click();
let pendiente = null;
$('#r-file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    pendiente = await MiEspacio.leerArchivo(f);
    $('#cf-p').textContent = 'Se reemplazarán los datos de este dispositivo con los del archivo (' + Object.keys(pendiente).length + ' elementos). Haz primero un respaldo si no estás seguro.';
    cerrar('o-resp'); abrir('o-conf');
  } catch (er) { toast('No se pudo restaurar: ' + er.message); }
};
$('#cf-ok').onclick = () => { if (!pendiente) return; MiEspacio.aplicar(pendiente); cerrar('o-conf'); toast('Datos restaurados'); setTimeout(() => location.reload(), 700); };

function todo() { const p = pintarHero(); pintarNotas(); pintarCompras(); pintarDock(p); pintarResp(); }
todo(); addEventListener('pageshow', todo);
</script>
